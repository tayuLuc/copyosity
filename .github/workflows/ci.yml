name: CI

# Continuous checks on pushes and PRs.
#
#  - check-macos:    the real gate. Runs `make check` (frontend typecheck/lint/tests
#                    plus Rust compile, Clippy, fmt, and tests) on Apple Silicon.
#  - audit:          ADVISORY. `cargo audit` over src-tauri/Cargo.lock, on
#                    third-party crates we do not control, so it is marked
#                    `continue-on-error`: a fresh upstream advisory must not
#                    block an unrelated PR. Its result goes to the job summary
#                    and to an annotation, never to a silently green job.
#  - build-windows:  EXPERIMENTAL. Copyosity is a macOS-native app (NSPanel,
#                    CGEvent, Vision OCR, Apple Events). On Windows those modules
#                    fall back to inert stubs, so this is at best a hollow,
#                    non-functional shell. It is marked `continue-on-error` so it
#                    never blocks the build — it just tracks how close the
#                    cross-platform core is to compiling on Windows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-macos:
    name: Check (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Full project check
        env:
          HUSKY: "0"
        run: make check

  audit:
    name: Cargo audit (advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        id: audit
        working-directory: src-tauri
        run: |
          set -uo pipefail
          echo '### cargo audit' >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report advisories
        if: steps.audit.outcome == 'failure'
        run: echo "::error title=cargo audit::advisories found"

  build-windows:
    name: Build (Windows, experimental — hollow shell)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # Type-check the cross-platform Rust core on Windows. macOS-only modules
      # compile to their inert stubs here; this surfaces any ungated native code.
      - name: Backend check (cargo, Windows)
        working-directory: src-tauri
        run: cargo check
