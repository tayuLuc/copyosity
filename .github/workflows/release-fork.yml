name: Fork release (unsigned)

# This fork is distributed as a Homebrew cask, so it needs release artifacts it
# can produce without Apple credentials. Upstream's release.yml signs with a
# Developer ID identity and notarizes via notarytool; this fork has neither the
# certificate nor the .p12 secrets, so it builds ad-hoc-signed bundles and ships
# them as-is. Consequences are spelled out in docs/FORK-NOTARIZATION.md.
#
# Pipeline: check (types, tests, lint) -> build per arch -> one release with both
# DMGs. The Homebrew cask in tayuLuc/homebrew-copyosity points at the DMG names
# produced here: Copyosity-<aarch64|x64>_<version>.dmg
#
# Trigger by pushing an annotated tag whose message becomes the release notes:
#   git tag -a v1.0.4-fork1 -m "notes" && git push origin v1.0.4-fork1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT: Copyosity

jobs:
  check:
    name: Type, test, lint
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Config gate (parse the files the Tauri build script reads)
        env:
          EXPECTED_UPDATER_KEY_ID: 1F02BEF343E06964
        run: |
          # Cheap guard for the failure that cost a whole cold-cache build: a
          # malformed capability file is only reported by cargo's build script,
          # minutes after the expensive steps have started.
          for f in src-tauri/tauri.conf.json src-tauri/capabilities/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f" >&2; exit 1; }
          done
          python3 - <<'PY'
          import base64, json, os
          caps = json.load(open("src-tauri/capabilities/main.json"))
          assert caps["permissions"], "main window has no permissions"
          conf = json.load(open("src-tauri/tauri.conf.json"))
          assert conf["bundle"]["macOS"]["signingIdentity"] == "-", \
              "a fork build must not point at someone else's Developer ID"
          # The channel used to be empty, which made self-update impossible. Now it
          # exists, so the guard flips: it must serve THIS repo and be verified
          # against the fork's own key. An endpoint pointing at upstream would let a
          # signed upstream build replace the fork on every installed machine.
          updater = conf["plugins"]["updater"]
          expected = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"
          assert updater["endpoints"] == [expected], \
              f"updater must serve this repo only, got {updater['endpoints']}"
          assert conf["bundle"]["createUpdaterArtifacts"] is True, \
              "an updater channel without signed tarballs is a dead endpoint"
          key_id = base64.b64decode(updater["pubkey"]).decode().split("minisign public key: ")[1].split("\n")[0]
          assert key_id == os.environ["EXPECTED_UPDATER_KEY_ID"], \
              f"pubkey belongs to {key_id}, not the fork key {os.environ['EXPECTED_UPDATER_KEY_ID']} " \
              "(upstream's key must never ship in a fork build)"
          print(f"updater channel: {expected} verified by {key_id}")

          # Version is stored in four files and upstream's release.sh bumps them in
          # one line. A fork that edits only tauri.conf.json leaves the other three
          # lying (measured on v1.0.4-fork1: 1.0.4-fork1 vs 1.0.4 in three places),
          # and a merge of an upstream release commit would silently drop the fork
          # suffix. Catch the disagreement here instead of in the tag check below,
          # which only ever compares one of the four.
          import tomllib
          with open("src-tauri/Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]["version"]
          with open("src-tauri/Cargo.lock", "rb") as f:
              lock = next(p["version"] for p in tomllib.load(f)["package"]
                          if p.get("name") == "copyosity")
          pkg = json.load(open("package.json"))["version"]
          versions = {"tauri.conf.json": conf["version"], "package.json": pkg,
                      "Cargo.toml": cargo, "Cargo.lock (copyosity)": lock}
          assert len(set(versions.values())) == 1, \
              "version manifests disagree: " + ", ".join(f"{k}={v}" for k, v in versions.items())
          print("version manifests agree on " + conf["version"])
          PY

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24" # matches .github/workflows/ci.yml
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./src-tauri -> target"
          lookup-only: true

      - run: npm ci

      - name: Frontend gate (svelte-check, node --test, lint)
        run: npm run check

      - name: Rust gate (crate tests, incl. smart_actions and qr_code)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    name: Build ${{ matrix.arch_label }}
    needs: check
    runs-on: macos-14
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            arch_label: aarch64
          - rust_target: x86_64-apple-darwin
            arch_label: x64
    env:
      CC_target_x86_64_apple_darwin: clang -arch x86_64
      CXX_target_x86_64_apple_darwin: clang++ -arch x86_64
      # With bundle.createUpdaterArtifacts these two make `tauri build` emit
      # Copyosity.app.tar.gz + .sig signed by the fork's own minisign key. The
      # public half is baked into tauri.conf.json, so a build without the secret
      # produces no updater artifact at all rather than an unusable one.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$GITHUB_REF_NAME" in
            v*)
              VERSION="${GITHUB_REF_NAME#v}"
              if [ "$VERSION" != "$CONF" ]; then
                echo "tag $GITHUB_REF_NAME disagrees with tauri.conf.json version $CONF" >&2
                exit 1
              fi
              ;;
            *)
              # workflow_dispatch on a branch: build whatever the config says
              VERSION="$CONF"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24" # matches .github/workflows/ci.yml
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust_target }}
          lookup-only: true

      - run: npm ci

      - name: Build .app (ad-hoc signed, no notarization)
        run: npm run tauri build -- --bundles app --target ${{ matrix.rust_target }}

      - name: Locate bundle
        id: app
        run: |
          APP=$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle" -maxdepth 3 -name "*.app" -type d | head -1)
          test -n "$APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Re-sign ad-hoc so the resource manifest exists
        run: |
          # Without a Developer ID, Tauri leaves the signature the Rust linker
          # stamped: ad-hoc, but with no _CodeSignature/CodeResources, which
          # Gatekeeper rejects as "code has no resources but signature indicates
          # they must be present". Re-signing with the codesign tool generates
          # the manifest. Lesson taken from superbereza/copyosity release.yml.
          codesign --force --deep --sign - "${STEPS_APP_OUTPUTS_PATH}"
          codesign --verify --verbose=2 "${STEPS_APP_OUTPUTS_PATH}"
          echo "--- signature ---"
          codesign -dvv "${STEPS_APP_OUTPUTS_PATH}" 2>&1 | grep -E "Identifier|CDHash|flags|Authority" || true
          echo "--- gatekeeper (expected: rejected, unnotarized) ---"
          spctl -a -vv -t install "${STEPS_APP_OUTPUTS_PATH}" 2>&1 || true
        env:
          STEPS_APP_OUTPUTS_PATH: ${{ steps.app.outputs.path }}

      - name: Rebuild the updater tarball without AppleDouble, then sign it
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          STEPS_APP_OUTPUTS_PATH: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          TARBALL="${PRODUCT}-${{ matrix.arch_label }}_${STEPS_VERSION_OUTPUTS_VERSION}.app.tar.gz"
          TDIR=$(mktemp -d "$RUNNER_TEMP/tar.XXXXXX")
          cp -R "${STEPS_APP_OUTPUTS_PATH}" "$TDIR/Copyosity.app"
          # Upstream's hard-won invariant (CLAUDE.md -> Updater delivery): macOS tar
          # embeds AppleDouble `._*` entries that the updater's Rust unpacker chokes
          # on, so the tarball is regenerated from the re-signed bundle with mac
          # metadata suppressed, and only then signed — the minisign signature covers
          # these exact bytes, not the tarball Tauri built during the bundle step.
          (
            cd "$TDIR"
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "$GITHUB_WORKSPACE/$TARBALL" Copyosity.app
          )
          rm -rf "$TDIR"
          python3 - "$TARBALL" <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as tf:
              names = tf.getnames()
          dirty = [n for n in names if "._" in n.split("/")[-1] or n.startswith("PaxHeaders")]
          print(f"tar entries: {len(names)}, dirty (AppleDouble/pax): {len(dirty)}")
          assert not dirty, f"updater tarball carries mac metadata: {dirty[:3]}"
          assert names and names[0] == "Copyosity.app", f"unexpected tar root: {names[:1]}"
          PY
          test -n "$KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is empty" >&2; exit 1; }
          npx --no-install tauri signer sign -k "$KEY" -p "$PASS" "$TARBALL"
          head -c 60 "$TARBALL.sig"; echo
          test -s "$TARBALL.sig"

      - name: Package UDZO DMG
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")
          mkdir -p "$STAGE/${PRODUCT}"
          cp -R "${STEPS_APP_OUTPUTS_PATH}" "$STAGE/${PRODUCT}/"
          ln -s /Applications "$STAGE/${PRODUCT}/Applications"
          DMG="${PRODUCT}-${{ matrix.arch_label }}_${STEPS_VERSION_OUTPUTS_VERSION}.dmg"
          hdiutil create -volname "$PRODUCT" -srcfolder "$STAGE/${PRODUCT}" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
        env:
          STEPS_APP_OUTPUTS_PATH: ${{ steps.app.outputs.path }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PRODUCT }}-${{ matrix.arch_label }}
          path: |
            *.dmg
            *.app.tar.gz
            *.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Notes from the annotated tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OBJ=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object | "\(.type) \(.sha)"')
          case "$OBJ" in
            "tag "*) gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ#tag }" --jq .message > notes.md ;;
            *) git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > notes.md ;;
          esac
          if [ ! -s notes.md ]; then
            printf 'Unsigned fork build of Copyosity. See %s for what this fork changes.\n' \
              "https://github.com/${GITHUB_REPOSITORY}" > notes.md
          fi
          printf '\n## Unsigned build\n\nThis artifact is ad-hoc signed and **not notarized**.\n' >> notes.md

      - name: Assemble latest.json for both Macs
        run: |
          # The release job has no `version` step of its own (that one lives in the
          # build job), so the tag carries the number into the manifest here.
          export VERSION="${GITHUB_REF_NAME#v}"
          # One manifest, two platforms: upstream's scripts/make-latest-json.sh only
          # ever emits darwin-aarch64, so an Intel install would never be offered an
          # update. Tauri reads signature+url per platform key from this file.
          REPO="$GITHUB_REPOSITORY" python3 - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone

          base = f"https://github.com/{os.environ['REPO']}/releases/download/v{os.environ['VERSION']}"
          keys = {"aarch64": "darwin-aarch64", "x64": "darwin-x86_64"}
          platforms = {}
          for path in sorted(glob.glob("artifacts/*.app.tar.gz")):
              name = os.path.basename(path)
              arch = name.split("-")[1].split("_")[0]
              with open(f"{path}.sig") as f:
                  signature = f.read().strip()
              assert signature.startswith("dW50cnVzdGVk"), f"{name}.sig is not minisign text"
              platforms[keys[arch]] = {"url": f"{base}/{name}", "signature": signature}
          assert set(platforms) == set(keys.values()), f"missing platforms: {set(keys.values()) - set(platforms)}"
          notes = open("notes.md").read().strip().splitlines()[0]
          json.dump(
              {
                  "version": os.environ["VERSION"],
                  "notes": notes,
                  "pub_date": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                  "platforms": platforms,
              },
              open("latest.json", "w"),
              indent=2,
          )
          print(open("latest.json").read())
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --latest matters more than it looks: every tag here carries a -forkN
          # suffix, and the updater endpoint is /releases/latest/download/latest.json,
          # so the pointer has to be pinned explicitly rather than trusted to GitHub's
          # semver ordering of suffixed tags.
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/*.app.tar.gz artifacts/*.app.tar.gz.sig latest.json \
            --latest \
            --title "$GITHUB_REF_NAME (unsigned fork build)" \
            --notes-file notes.md
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

      - name: Verify the channel the app will actually read
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          curl -fsSL "$URL" -o served.json
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, subprocess, sys

          doc = json.load(open("served.json"))
          version = sys.argv[1]
          assert doc["version"] == version, f"manifest says {doc['version']}, tag says {version}"
          assert len(doc["platforms"]) == 2, doc["platforms"].keys()
          for platform, entry in doc["platforms"].items():
              code = subprocess.run(
                  ["curl", "-o", "/dev/null", "-w", "%{http_code}", "-L", "--fail-with-body", entry["url"]],
                  capture_output=True,
                  text=True,
              )
              assert code.returncode == 0 and code.stdout == "200", f"{platform}: {entry['url']} -> {code.stdout} {code.stderr}"
              print(f"{platform}: url ok, signature {len(entry['signature'])} chars")
          PY
