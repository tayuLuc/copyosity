name: Lint Actions

# MegaLinter over the one class of files `make check` never reaches: the workflow
# YAML itself. `ENABLE_LINTERS` picks four of its 136 linters.
#
# All four block: actionlint for Actions syntax and the shell inside `run:` steps,
# yamllint for YAML style, zizmor for the security posture of the workflows,
# shellcheck for the repository's shell scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  actions-yaml:
    name: Lint (Actions YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: "true"
          APPLY_FIXES: "none"
          ENABLE_LINTERS: ACTION_ACTIONLINT,ACTION_ZIZMOR,YAML_YAMLLINT,BASH_SHELLCHECK
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN

      - name: Upload the reports
        if: success() || failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: megalinter-reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
